
name: Test, Build and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leave-management-deployment
  cancel-in-progress: false

jobs:

  # =====================================
  # JOB 1: TEST
  # =====================================
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Run API tests
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/leave-management-test
          AUTH_SECRET: test-only-secret-with-at-least-32-characters
          WARDEN_USERNAME: test-warden
          WARDEN_PASSWORD: test-only-warden-password
        run: npm test

  # =====================================
  # JOB 2: BUILD
  # =====================================
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Build verification
        run: echo "Application build stage completed successfully."

  # =====================================
  # JOB 3: DEPLOY
  # =====================================
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Render deployment hook is not configured."
            echo "Check whether Render auto-deploy is enabled."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 30 \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Deployment notification
        run: echo "Render deployment trigger completed."
